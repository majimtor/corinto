# Grouped weekly updates, one pull request per ecosystem. Minor and patch
# versions travel together; a major version gets a pull request of its own.
# Each ecosystem waits a week after a release before proposing it, which
# keeps a withdrawn or compromised release out of the queue. The messages
# follow the commit rules of the repository. Nothing merges on its own
# (docs/engineering-rules.md, "Dependencies").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      compose:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The major version of PostgreSQL is moved by hand, with the figures
      # redone: PLAN.md section 20 says how, and section 21 when.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      browser-tests:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
