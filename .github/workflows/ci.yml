name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Build and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Compile and run the static analysers
        run: make lint

  contract:
    name: Contract compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with its tags: the contract is compared with
          # the one of the last release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Compare the contract with the one of the last release
        run: make contract

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run the unit tests with the race detector
        run: make test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run the tests that need a real PostgreSQL
        run: make integration

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that a secret committed long ago is found.
          fetch-depth: 0
          # The repository is mounted into the scanner's container, so the
          # workflow token is not left in its Git configuration.
          persist-credentials: false
      - name: Scan the full history
        run: make secrets

  docs:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Markdown files
        run: make docs

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: make image

  load:
    name: Load smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A few seconds of the load scenario with wide thresholds: that the
      # command works and that nothing got worse by an order of magnitude.
      # A shared runner publishes no figure (ADR 0020).
      - name: Run the load scenario for a few seconds
        run: make bench-smoke

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The whole path of the panel in Chromium, with axe on every page, and
      # the demo entry in Firefox and WebKit, against the stack that the
      # target starts. The flag installs what the browsers need of the
      # runner.
      - name: Run the browser tests against the local stack
        run: make e2e PLAYWRIGHT_DEPS=--with-deps
      # The pages as the run saw them, also when it failed.
      - name: Keep the screenshots of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 30
