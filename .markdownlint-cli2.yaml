# Markdown lint configuration, shared by CI and local runs of `make docs`.
config:
  # Tables are exempt from the 80-column limit; prose and code are not.
  MD013:
    tables: false
ignores:
  # Pull request templates start at the second heading level by convention.
  - .github/pull_request_template.md
  # Written by the release tool from the commit history; its layout is not
  # ours to change.
  - CHANGELOG.md
  # What the browser tests install and leave behind: the documents of other
  # projects, and the notes of a run that failed.
  - e2e/node_modules
  - e2e/results
