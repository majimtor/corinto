openapi: 3.1.1
info:
  title: Corinto management API
  summary: Links, their metrics and the webhooks around them.
  description: |
    The contract of the management API. It is written before the code that
    serves it, and the server is checked against it.

    Every path starts with the major version. Within a major version changes
    are additive: clients must tolerate fields and enumeration values they do
    not know.

    Errors are Problem Details (RFC 9457) with a stable `code`. Text in an
    error is for developers and is not translated; clients translate from
    the code. `type` is always `about:blank`: the code is what identifies an
    error.

    A request that matches no operation is answered `404` with the code
    `not_found`, or `405` with the code `method_not_allowed` and the methods
    of the path in `Allow`. A request whose declared body is larger than
    16 kB is answered `413` with the code `payload_too_large` whatever its
    path. All three are Problem Details.

    Every response carries `X-Request-Id`, which names the request in the
    logs of the server.

    An operation that needs a key says so, with the scope the key must
    hold. The key travels in the `Authorization` header and nowhere else. A
    request without a valid key is answered `401`, the same whatever is
    wrong with the key; one whose key lacks the scope, `403`.

    A key makes at most 120 requests a minute, of which at most 60 change
    something. After 10 requests in a minute without a valid key, the
    address they come from is refused for the rest of that minute, with a
    valid key too. In both cases the answer is `429` with `Retry-After`.
  # The version of the release this document belongs to. The release tool
  # writes it, on the line that carries its mark.
  version: 0.0.0 # x-release-please-version
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: The host that serves the API.
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Whether the API answers.
      description: >-
        Says that the process that serves the API is running. It asks
        nothing of the database and needs no key.
      security: []
      responses:
        "200":
          description: The API answers.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /v1/key:
    get:
      operationId: getKey
      summary: The key of the request.
      description: >-
        Says which key the request was made with, the workspace it acts in
        and what it may do there. Any valid key may ask.
      security:
        - apiKey: []
      responses:
        "200":
          description: The key.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links:
    post:
      operationId: createLink
      summary: Create a link.
      description: >-
        Creates a link of the workspace of the key. Without an `alias` the
        short identifier is generated. What the link redirects to is the
        destination with the campaign parameters appended, computed once
        here.
      security:
        - apiKey: [links:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDraft"
      responses:
        "201":
          description: The link that was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: The path of the link.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          description: >-
            The alias is taken (`alias_taken`) or the workspace holds as many
            links as its quota allows (`quota_exceeded`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listLinks
      summary: List the links of the workspace.
      description: >-
        Returns the links of the workspace of the key in the order in which
        they were created, a page at a time. A link created while the pages
        are read is neither repeated nor skipped.
      security:
        - apiKey: [links:read]
      parameters:
        - name: limit
          in: query
          description: The most links in the page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: >-
            The `next_cursor` of the page before. Without it the listing
            starts at the first link.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: A page of links.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      operationId: getLink
      summary: Read a link.
      description: >-
        Returns a link of the workspace of the key. A link of another
        workspace, a deleted one and one that never existed all answer
        `404`.
      security:
        - apiKey: [links:read]
      responses:
        "200":
          description: The link.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateLink
      summary: Change a link.
      description: >-
        Changes what the body names and nothing else, as a JSON Merge Patch
        (RFC 7396): a field that is left out stays as it is, and a null
        removes what the link had. The identifier of a link never changes.
        A request that leaves the link as it was is not an error.
      security:
        - apiKey: [links:write]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/LinkChange"
      responses:
        "200":
          description: The link after the change.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LinkBlocked"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLink
      summary: Delete a link.
      description: >-
        Erases what the link led to and what described it, for good. Its
        short identifier is never issued again. A blocked link can be
        deleted.
      security:
        - apiKey: [links:write]
      responses:
        "204":
          description: The link is deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      operationId: disableLink
      summary: Stop a link from redirecting.
      description: >-
        The link stops redirecting until it is enabled again. Disabling a
        link that is already disabled changes nothing and is not an error.
      security:
        - apiKey: [links:write]
      responses:
        "200":
          $ref: "#/components/responses/Link"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LinkBlocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      operationId: enableLink
      summary: Let a disabled link redirect again.
      description: >-
        Enabling a link that is already active changes nothing and is not
        an error.
      security:
        - apiKey: [links:write]
      responses:
        "200":
          $ref: "#/components/responses/Link"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/LinkBlocked"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}/metrics/summary:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      operationId: getLinkMetricsSummary
      summary: The figures of a link over a period.
      description: >-
        Adds up what the link was asked for between `from` and `to`, which
        are on the hour in UTC. Like every answer about metrics, it says
        how far the figures reach and which rules classified them.
      security:
        - apiKey: [metrics:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The figures of the period.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}/metrics/series:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      operationId: getLinkMetricsSeries
      summary: The figures of a link, hour by hour or day by day.
      description: >-
        Returns the figures of every hour, or of every day of UTC, between
        `from` and `to`, in order. An hour or a day in which nothing
        happened is there, with zeros. By the hour, `from` and `to` are on
        the hour and at most 31 days apart; by the day, they are at
        midnight in UTC.
      security:
        - apiKey: [metrics:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: granularity
          in: query
          required: true
          description: What a point of the series covers.
          schema:
            $ref: "#/components/schemas/Granularity"
      responses:
        "200":
          description: The series.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSeries"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/links/{id}/metrics/breakdown:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      operationId: getLinkMetricsBreakdown
      summary: The estimated human clicks of a link, by one dimension.
      description: >-
        Returns the values of one dimension that had the most estimated
        human clicks between `from` and `to`, which are at midnight in UTC:
        a breakdown is kept by the day. It counts estimated human clicks
        and no other request, and it is of one dimension, never of two
        crossed.
      security:
        - apiKey: [metrics:read]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: dimension
          in: query
          required: true
          description: What the clicks are told apart by.
          schema:
            $ref: "#/components/schemas/Dimension"
        - name: limit
          in: query
          description: >-
            The most values to name. The clicks of the others are added up
            in `other`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The breakdown.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsBreakdown"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/ingestion:
    get:
      operationId: getIngestionStatus
      summary: What became of the events of the workspace, day by day.
      description: >-
        Returns, for each of the last days of UTC, how many responses owed
        the workspace an event and what became of those events, counted by
        the day of the access. `lost` is what was served and not accepted,
        and `accepted` is `processed`, `pending` and `dead_lettered` added
        up, in every answer. It also says how far the events of the whole
        service are processed, and when what has been kept for its time
        was last deleted.
      security:
        - apiKey: [metrics:read]
      parameters:
        - name: days
          in: query
          description: How many days to return, today included.
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 7
      responses:
        "200":
          description: The status of the ingestion.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionStatus"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/openapi.yaml:
    get:
      operationId: getContract
      summary: This document.
      description: >-
        The contract the server validates requests against, as the binary
        embeds it. It needs no key.
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            # No schema: the document is described by the OpenAPI
            # specification, not by itself.
            application/yaml: {}
        "400":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        An API key of a workspace, in the `Authorization` header. Each
        operation names the scope it requires, or none when any valid key
        will do.
  parameters:
    LinkId:
      name: id
      in: path
      required: true
      description: The `id` of the link.
      schema:
        type: string
    From:
      name: from
      in: query
      required: true
      description: >-
        The beginning of the period, which is part of it. A moment on the
        hour in UTC, or at midnight in UTC where the operation counts by
        days.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: >-
        The end of the period, which is not part of it. Aligned like
        `from`, later than it, and at most 397 days after it: the longest
        that the 13 months aggregates are kept for can be.
      schema:
        type: string
        format: date-time
  headers:
    RequestId:
      description: >-
        Identifier the server gives to the request. It is in the log line of
        the request and is never taken from the client.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: An error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Link:
      description: The link.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Link"
    LinkBlocked:
      description: >-
        The operator blocked the link (`link_blocked`). Its workspace can
        still read it and delete it, and nothing else.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: >-
        The request has no valid key. The answer is the same for a missing
        key, a malformed one, one that does not exist, a wrong secret, a
        revoked key and an expired one.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          description: The scheme the API accepts.
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many requests in a minute, from the key or from the address.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Seconds to wait before the next request.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Key:
      type: object
      required: [id, workspace_id, scopes, expires_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          description: When the key stops being valid, or null when it has no expiry.
          type: [string, "null"]
          format: date-time
    Link:
      type: object
      required:
        - id
        - domain
        - identifier
        - state
        - destination
        - resolved_destination
        - campaign
        - title
        - tags
        - expires_at
        - created_at
        - updated_at
      properties:
        id:
          description: Identifier of the link in the API. It never changes.
          type: string
        domain:
          description: The host that serves the short link.
          type: string
        identifier:
          description: >-
            What follows the domain in the short link: generated, or the
            alias the link was created with.
          type: string
        state:
          description: >-
            `active` redirects; `disabled` does not until it is enabled
            again; `blocked` was stopped by the operator and can only be
            read and deleted. A link past its `expires_at` keeps its state
            and does not redirect.
          type: string
          enum: [active, disabled, blocked]
        destination:
          description: Where the link leads, in the form in which it is stored.
          type: string
        resolved_destination:
          description: >-
            What the short link redirects to: the destination with the
            campaign parameters appended.
          type: string
        campaign:
          $ref: "#/components/schemas/Campaign"
        title:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        expires_at:
          description: When the link stops redirecting, or null when it does not expire.
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Campaign:
      description: >-
        The campaign parameters of a link: `utm_source`, `utm_medium`,
        `utm_campaign`, `utm_term` and `utm_content`, in that order. A null
        is a parameter the link does not set.
      type: object
      required: [source, medium, name, term, content]
      properties:
        source:
          type: [string, "null"]
        medium:
          type: [string, "null"]
        name:
          type: [string, "null"]
        term:
          type: [string, "null"]
        content:
          type: [string, "null"]
    LinkDraft:
      description: What is given to create a link.
      type: object
      required: [destination]
      additionalProperties: false
      properties:
        destination:
          description: >-
            An `http` or `https` URL, already percent-encoded, with a public
            domain name as its host and no credentials. A workspace with an
            allowlist takes only the destinations that match it.
          type: string
          minLength: 1
          maxLength: 2048
        alias:
          description: >-
            The short identifier to use instead of a generated one. Only a
            workspace with the permission may choose it.
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        campaign:
          $ref: "#/components/schemas/CampaignDraft"
        title:
          type: string
          minLength: 1
          maxLength: 200
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        expires_at:
          description: Later than the moment of the request.
          type: string
          format: date-time
    CampaignDraft:
      description: The campaign parameters to set. One that is left out is not set.
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/CampaignValue"
        medium:
          $ref: "#/components/schemas/CampaignValue"
        name:
          $ref: "#/components/schemas/CampaignValue"
        term:
          $ref: "#/components/schemas/CampaignValue"
        content:
          $ref: "#/components/schemas/CampaignValue"
    CampaignValue:
      type: string
      minLength: 1
      maxLength: 200
    LinkChange:
      description: >-
        What changes in a link. A field that is left out stays as it is; a
        null removes what the link had.
      type: object
      additionalProperties: false
      properties:
        destination:
          description: As in a new link. A link always has one, so it cannot be null.
          type: string
          minLength: 1
          maxLength: 2048
        campaign:
          description: >-
            The parameters named change and the others stay. A null
            parameter is removed; a null campaign removes them all.
          type: [object, "null"]
          additionalProperties: false
          properties:
            source:
              $ref: "#/components/schemas/CampaignValueChange"
            medium:
              $ref: "#/components/schemas/CampaignValueChange"
            name:
              $ref: "#/components/schemas/CampaignValueChange"
            term:
              $ref: "#/components/schemas/CampaignValueChange"
            content:
              $ref: "#/components/schemas/CampaignValueChange"
        title:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
        tags:
          description: The tags the link has from now on. A null leaves none.
          type: [array, "null"]
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
        expires_at:
          description: Later than the moment of the request, or null for a link that does not expire.
          type: [string, "null"]
          format: date-time
    CampaignValueChange:
      type: [string, "null"]
      minLength: 1
      maxLength: 200
    LinkPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        next_cursor:
          description: >-
            What to send as `cursor` for the next page, or null when this is
            the last one. It is opaque: a client sends it back as it came.
          type: [string, "null"]
    Granularity:
      description: What a point of a series covers, an hour or a day of UTC.
      type: string
      enum: [hour, day]
    Dimension:
      description: >-
        What the estimated human clicks of a breakdown are told apart by.
        `referrer_host` is the host of the page the click came from, as the
        requester said it, with `(none)` for the clicks that named no page.
        `device` and `browser` are closed lists read from the user-agent.
      type: string
      enum: [referrer_host, device, browser]
    Metrics:
      description: What every answer about the metrics of a link carries.
      type: object
      required: [link_id, from, to, processed_through, synthetic, rule_versions]
      properties:
        link_id:
          type: string
        from:
          description: The beginning of the period, which is part of it.
          type: string
          format: date-time
        to:
          description: The end of the period, which is not part of it.
          type: string
          format: date-time
        processed_through:
          description: >-
            How far the figures reach: every event accepted before this
            moment has been counted, or set aside because it could not be.
            It is the moment the oldest event that still waits was
            accepted, or the moment of the answer when none waits. It is of
            the whole service, not of the link. A request served shortly
            before it may not be in the figures yet: its event is accepted
            after the request is answered, within a second unless something
            is failing.
          type: string
          format: date-time
        synthetic:
          description: >-
            Whether the figures are of generated traffic and not of
            visitors. True in a demo workspace.
          type: boolean
        rule_versions:
          description: >-
            The versions of the classification rules that were in use during
            the period, the one that began first at the head. More than one
            means that the rules changed: what comes before and after the
            `first_hour` of a later version was classified by different
            rules, and what was classified is never classified again. Empty
            when the period is before the first event that was classified,
            or after the last.
          type: array
          items:
            $ref: "#/components/schemas/RuleVersion"
    RuleVersion:
      description: >-
        A version of the classification rules, with the hours of the first
        and of the last event it classified, in any workspace.
      type: object
      required: [version, first_hour, last_hour]
      properties:
        version:
          type: integer
          minimum: 1
        first_hour:
          type: string
          format: date-time
        last_hour:
          type: string
          format: date-time
    Figures:
      description: The metrics of a link over some time.
      type: object
      required: [requests, inactive_requests, estimated_human_clicks]
      properties:
        requests:
          description: >-
            How many times the link redirected, whoever asked: crawlers,
            previews, prefetches and repeated clicks are all in it.
          type: integer
          minimum: 0
        inactive_requests:
          description: >-
            How many times the link was asked for while it was disabled,
            expired or blocked, and did not redirect.
          type: integer
          minimum: 0
        estimated_human_clicks:
          description: >-
            The redirects whose request the rules did not take for a
            prefetch, automation, a preview or a crawler. An estimate from
            the headers of the request: whatever presents itself as a
            browser counts, so the error is by excess. They are neither
            people nor unique clicks.
          type: integer
          minimum: 0
    MetricsSummary:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - $ref: "#/components/schemas/Figures"
    MetricsSeries:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - type: object
          required: [granularity, points]
          properties:
            granularity:
              $ref: "#/components/schemas/Granularity"
            points:
              description: >-
                One point for every hour or day of the period, in order: at
                most 744 by the hour and 397 by the day.
              type: array
              maxItems: 744
              items:
                $ref: "#/components/schemas/MetricsPoint"
    MetricsPoint:
      description: The figures of one hour, or of one day of UTC.
      allOf:
        - type: object
          required: [start]
          properties:
            start:
              description: The beginning of the hour or of the day.
              type: string
              format: date-time
        - $ref: "#/components/schemas/Figures"
    MetricsBreakdown:
      allOf:
        - $ref: "#/components/schemas/Metrics"
        - type: object
          required: [dimension, items, other]
          properties:
            dimension:
              $ref: "#/components/schemas/Dimension"
            items:
              description: >-
                The values with the most estimated human clicks, the most
                clicked first, and at most `limit` of them.
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/BreakdownItem"
            other:
              description: >-
                The estimated human clicks of the values that `items` does
                not name: the ones past `limit` and, for the referrer host,
                the hosts past the 100 a link keeps for a day.
              type: integer
              minimum: 0
    BreakdownItem:
      type: object
      required: [value, estimated_human_clicks]
      properties:
        value:
          type: string
        estimated_human_clicks:
          type: integer
          minimum: 0
    IngestionStatus:
      type: object
      required: [processed_through, retention, days]
      properties:
        processed_through:
          description: >-
            How far the events of the whole service are processed, as in
            every answer about metrics: the moment the oldest event that
            still waits was accepted, or the moment of the answer when none
            waits.
          type: string
          format: date-time
        retention:
          description: The job that deletes what has been kept for its time, once a day.
          type: object
          required: [last_finished_at]
          properties:
            last_finished_at:
              description: When it last finished, or null when it never has.
              type: [string, "null"]
              format: date-time
        days:
          description: >-
            One entry for each day, the oldest first and today the last. A
            day in which nothing happened is there, with zeros.
          type: array
          minItems: 1
          maxItems: 31
          items:
            $ref: "#/components/schemas/IngestionDay"
    IngestionDay:
      description: >-
        What became of the events that the responses of one day owed the
        workspace.
      type: object
      required: [day, served, accepted, lost, processed, pending, dead_lettered]
      properties:
        day:
          description: The day of the accesses, in UTC.
          type: string
          format: date
        served:
          description: >-
            Responses that owed an event: a redirect, and the `404` of a
            link that is disabled, expired or blocked.
          type: integer
          minimum: 0
        accepted:
          description: Events that reached the inbox, where they are first durable.
          type: integer
          minimum: 0
        lost:
          description: >-
            Served and never accepted: the difference between the two,
            never below zero. It settles once the events that still wait in
            the memory of the redirect have been written.
          type: integer
          minimum: 0
        processed:
          description: Accepted events that are in the figures.
          type: integer
          minimum: 0
        pending:
          description: Accepted events that wait, for their first attempt or a later one.
          type: integer
          minimum: 0
        dead_lettered:
          description: >-
            Accepted events that failed on every attempt and were set
            aside.
          type: integer
          minimum: 0
    Scope:
      description: One thing a key may do in its workspace.
      type: string
      enum:
        - links:read
        - links:write
        - metrics:read
        - webhooks:read
        - webhooks:write
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          description: >-
            Stable identifier of the error. New values are added with the
            operations that need them.
          enum:
            - invalid_request
            - not_found
            - method_not_allowed
            - payload_too_large
            - internal_error
            - unauthenticated
            - forbidden
            - rate_limited
            - unavailable
            - unsupported_media_type
            - alias_taken
            - quota_exceeded
            - link_blocked
        errors:
          type: array
          description: One entry per field of the request that was rejected.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [in, field, code]
      properties:
        in:
          description: Where the rejected value was sent.
          type: string
          enum: [body, query]
        field:
          description: >-
            Which value was rejected: in the body, a JSON Pointer to it,
            which is empty for the body as a whole; in the query, the name
            of the parameter.
          type: string
        code:
          description: >-
            Why it was rejected. New values are added with the operations
            that need them.
          type: string
          enum:
            - required
            - unknown
            - invalid
            - too_short
            - too_long
            - too_many
            - duplicate
            - characters
            - scheme
            - credentials
            - host
            - port
            - dot_segment
            - redirect_domain
            - not_allowed
            - reserved
            - not_permitted
            - conflict
            - in_the_past
            - not_aligned
            - not_after_from
            - period_too_long
