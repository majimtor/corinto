# The whole system on one machine. Start it with `make up`, which first
# generates the database password in deploy/.env; nothing in this file is a
# secret. Ports are published on the loopback interface only: the local run is
# not a deployment.
name: corinto

services:
  db:
    image: postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    environment:
      POSTGRES_DB: corinto
      POSTGRES_USER: corinto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up, which generates deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username corinto --dbname corinto"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies the migrations and exits. It is the only service that changes
  # the schema; the others wait for it, because a process refuses to start
  # on a schema it was not built with.
  migrate:
    build: &image
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["migrate"]
    environment:
      CORINTO_DATABASE_URL: &database-url postgres://corinto:${POSTGRES_PASSWORD}@db:5432/corinto
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *image
    command: ["api"]
    environment:
      CORINTO_DATABASE_URL: *database-url
      CORINTO_API_ADDR: ":8080"
      CORINTO_HEALTH_ADDR: ":8081"
      # Where the redirect of the local stack will answer. Links are stored
      # with it.
      CORINTO_REDIRECT_DOMAIN: "localhost:8082"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  redirect:
    build: *image
    command: ["redirect"]
    environment:
      CORINTO_DATABASE_URL: *database-url
      CORINTO_REDIRECT_ADDR: ":8082"
      CORINTO_HEALTH_ADDR: ":8081"
      # The name the short links of the local stack are followed under.
      CORINTO_REDIRECT_DOMAIN: "localhost:8082"
    ports:
      - "127.0.0.1:8082:8082"
      # The health endpoints of this process, next to the ones of api.
      - "127.0.0.1:8083:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
